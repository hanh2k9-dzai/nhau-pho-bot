<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhậu Phố Simulator 2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; color: white; }

        canvas { display: block; width: 100vw; height: 100vh; }

        /* MENU UI */
        #menu-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        #menu-screen h1 { font-size: 34px; color: #f1c40f; margin-bottom: 15px; text-shadow: 0 0 10px #000; }
        .menu-btn {
            width: 200px; padding: 14px; margin: 8px; border: none; border-radius: 25px;
            font-size: 16px; font-weight: bold; color: white; cursor: pointer; background: #e74c3c;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* HUD MÁU */
        #hud {
            position: absolute; top: 12px; left: 12px; right: 12px;
            display: none; justify-content: space-between; z-index: 50; pointer-events: none;
        }
        .hp-box { background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 8px; width: 150px; border: 1px solid #555; }
        .hp-bar { width: 100%; height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 4px; }
        .hp-fill { height: 100%; transition: width 0.1s; }

        /* JOYSTICK MOBILE */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 110px; height: 110px;
            background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%; z-index: 50; display: none;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 44px; height: 44px;
            margin-top: -22px; margin-left: -22px; background: #ffffff; border-radius: 50%; pointer-events: none;
        }

        /* NÚT CHIÊU MOBILE */
        .btn-act {
            position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4);
            color: white; font-weight: bold; z-index: 50; display: none; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn-act:active { transform: scale(0.9); }
        #btn-atk { bottom: 30px; right: 30px; background: #e74c3c; width: 75px; height: 75px; font-size: 16px; }
        #btn-def { bottom: 120px; right: 25px; background: #3498db; width: 55px; height: 55px; font-size: 13px; }
        #btn-s1 { bottom: 30px; right: 120px; background: #f1c40f; color: #000; width: 55px; height: 55px; font-size: 13px; }
        #btn-s2 { bottom: 95px; right: 90px; background: #9b59b6; width: 55px; height: 55px; font-size: 13px; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- MENU -->
    <div id="menu-screen">
        <h1>🍻 NHẬU PHỐ 2D</h1>
        <button class="menu-btn" onclick="startGame()">🚀 VÀO CHIẾN NAY</button>
    </div>

    <!-- HUD THANH MÁU -->
    <div id="hud">
        <div class="hp-box">
            <div style="font-size:11px; font-weight:bold;">🧑 BẠN</div>
            <div class="hp-bar"><div id="p-hp" class="hp-fill" style="background:#2ecc71; width:100%;"></div></div>
        </div>
        <div class="hp-box" style="text-align:right;">
            <div style="font-size:11px; font-weight:bold;">😈 CÔN ĐỒ</div>
            <div class="hp-bar"><div id="e-hp" class="hp-fill" style="background:#e74c3c; width:100%;"></div></div>
        </div>
    </div>

    <!-- CONTROLS MOBILE -->
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <button class="btn-act" id="btn-atk">ĐẤM</button>
    <button class="btn-act" id="btn-def">THỦ</button>
    <button class="btn-act" id="btn-s1">NÉM</button>
    <button class="btn-act" id="btn-s2">XOAY</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let inGame = false;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        // ĐỐI TƯỢNG BẠN
        let player = {
            x: 100, y: 100, r: 25, speed: 4.5,
            hp: 220, maxHp: 220,
            vx: 0, vy: 0,
            state: "IDLE", timer: 0
        };

        // ĐỐI TƯỢNG CÔN ĐỒ
        let enemy = {
            x: 300, y: 300, r: 28, speed: 2.2,
            hp: 100, maxHp: 100, cooldown: 0, hit: 0
        };

        let keys = {};
        let dmgTexts = [];
        let fxList = [];

        function spawnEnemy() {
            enemy.hp = enemy.maxHp;
            enemy.x = canvas.width * 0.75;
            enemy.y = canvas.height / 2;
        }

        function startGame() {
            inGame = true;
            document.getElementById("menu-screen").style.display = "none";
            document.getElementById("hud").style.display = "flex";

            player.x = canvas.width / 4;
            player.y = canvas.height / 2;
            player.hp = player.maxHp;

            spawnEnemy();

            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById("joystick-zone").style.display = "block";
                document.querySelectorAll(".btn-act").forEach(b => b.style.display = "flex");
            }
        }

        // BÀN PHÍM PC
        window.addEventListener("keydown", e => {
            keys[e.key.toLowerCase()] = true;
            if(!inGame) return;
            if(e.key.toLowerCase() === 'j') doAttack("PUNCH");
            if(e.key.toLowerCase() === 'k') doAttack("DEFEND");
            if(e.key.toLowerCase() === 'l') doAttack("THROW");
            if(e.key.toLowerCase() === 'u') doAttack("SPIN");
        });
        window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

        function doAttack(type) {
            if(player.timer > 0) return;
            player.timer = 15;

            if(type === "PUNCH") {
                player.state = "ATK";
                let d = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if(d < 75) hitEnemy(Math.floor(Math.random()*6) + 15);
            } else if(type === "DEFEND") {
                player.state = "DEF";
            } else if(type === "THROW") {
                let a = Math.atan2(enemy.y - player.y, enemy.x - player.x);
                fxList.push({type: "BOTTLE", x: player.x, y: player.y, vx: Math.cos(a)*11, vy: Math.sin(a)*11, life: 35});
            } else if(type === "SPIN") {
                fxList.push({type: "SPIN", x: player.x, y: player.y, r: 10, life: 15});
                let d = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if(d < 90) hitEnemy(Math.floor(Math.random()*6) + 15);
            }
        }

        function hitEnemy(dmg) {
            enemy.hp -= dmg;
            enemy.hit = 8;
            dmgTexts.push({x: enemy.x, y: enemy.y - 30, text: "-" + dmg, life: 25, color: "#ff4d4d"});
            if(enemy.hp <= 0) spawnEnemy();
        }

        // ĐIỀU KHIỂN JOYSTICK MOBILE
        const zone = document.getElementById("joystick-zone");
        const knob = document.getElementById("joystick-knob");
        let activeTouchId = null;

        zone.addEventListener("touchstart", (e) => {
            e.preventDefault(); const touch = e.changedTouches[0];
            activeTouchId = touch.identifier; moveKnob(touch);
        }, { passive: false });

        window.addEventListener("touchmove", (e) => {
            if (activeTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === activeTouchId) { moveKnob(e.changedTouches[i]); break; }
            }
        }, { passive: false });

        const stopKnob = (e) => {
            if (activeTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === activeTouchId) {
                    activeTouchId = null; knob.style.transform = `translate(0px, 0px)`;
                    player.vx = 0; player.vy = 0; break;
                }
            }
        };
        window.addEventListener("touchend", stopKnob); window.addEventListener("touchcancel", stopKnob);

        function moveKnob(touch) {
            const rect = zone.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width / 2);
            let dy = touch.clientY - (rect.top + rect.height / 2);
            let dist = Math.hypot(dx, dy); let maxR = 40;
            if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            player.vx = (dx / maxR) * player.speed; player.vy = (dy / maxR) * player.speed;
        }

        // BẮT NÚT CHIÊU MOBILE
        function bind(id, type) {
            let b = document.getElementById(id);
            if(b) {
                b.addEventListener("touchstart", (e) => { e.preventDefault(); doAttack(type); }, { passive: false });
                b.onclick = () => doAttack(type);
            }
        }
        bind("btn-atk", "PUNCH"); bind("btn-def", "DEFEND");
        bind("btn-s1", "THROW"); bind("btn-s2", "SPIN");

        // CẬP NHẬT GAME
        function update() {
            if(inGame) {
                // Di chuyển bằng Phím (PC)
                if(keys['w'] || keys['arrowup']) player.y -= player.speed;
                if(keys['s'] || keys['arrowdown']) player.y += player.speed;
                if(keys['a'] || keys['arrowleft']) player.x -= player.speed;
                if(keys['d'] || keys['arrowright']) player.x += player.speed;

                // Di chuyển bằng Joystick (Mobile)
                player.x += player.vx; player.y += player.vy;

                // Giới hạn màn hình
                player.x = Math.max(25, Math.min(canvas.width - 25, player.x));
                player.y = Math.max(25, Math.min(canvas.height - 25, player.y));

                if(player.timer > 0) {
                    player.timer--;
                    if(player.timer === 0) player.state = "IDLE";
                }

                // Côn đồ đuổi theo
                let edx = player.x - enemy.x;
                let edy = player.y - enemy.y;
                let edist = Math.hypot(edx, edy);

                if(edist > 42) {
                    enemy.x += (edx / edist) * enemy.speed;
                    enemy.y += (edy / edist) * enemy.speed;
                } else {
                    if(enemy.cooldown <= 0) {
                        let dmg = Math.floor(Math.random()*5) + 11;
                        if(player.state === "DEF") dmg = Math.floor(dmg * 0.2);
                        player.hp -= dmg;
                        dmgTexts.push({x: player.x, y: player.y - 30, text: "-" + dmg, life: 25, color: player.state === "DEF" ? "#3498db" : "#ff4d4d"});
                        enemy.cooldown = 40;
                    }
                }

                if(enemy.cooldown > 0) enemy.cooldown--;
                if(enemy.hit > 0) enemy.hit--;

                // FX Đòn đánh
                fxList.forEach((fx, i) => {
                    fx.life--;
                    if(fx.type === "BOTTLE") {
                        fx.x += fx.vx; fx.y += fx.vy;
                        if(Math.hypot(fx.x - enemy.x, fx.y - enemy.y) < 32) {
                            hitEnemy(18); fx.life = 0;
                        }
                    }
                    if(fx.life <= 0) fxList.splice(i, 1);
                });

                // Cập nhật Thanh máu UI
                document.getElementById("p-hp").style.width = Math.max(0, (player.hp/player.maxHp)*100) + "%";
                document.getElementById("e-hp").style.width = Math.max(0, (enemy.hp/enemy.maxHp)*100) + "%";
            }

            dmgTexts.forEach((d, i) => {
                d.y -= 1; d.life--;
                if(d.life <= 0) dmgTexts.splice(i, 1);
            });
        }

        // VẼ MÀN HÌNH
        function draw() {
            ctx.fillStyle = "#221c19";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Bàn nhậu trang trí
            ctx.fillStyle = "#4a3328";
            ctx.beginPath(); ctx.arc(140, 140, 45, 0, Math.PI*2); ctx.fill();

            // VẼ CÔN ĐỒ
            ctx.fillStyle = enemy.hit > 0 ? "#ffffff" : "#d63031";
            ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.r, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "#ff7675"; ctx.lineWidth = 3; ctx.stroke();

            ctx.fillStyle = "#ffffff"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("😈 CÔN ĐỒ", enemy.x, enemy.y - 36);

            // VẼ BẠN
            if(inGame) {
                ctx.fillStyle = player.state === "ATK" ? "#e67e22" : "#0984e3";
                ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();

                if(player.state === "DEF") {
                    ctx.strokeStyle = "#2ecc71"; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 6, 0, Math.PI*2); ctx.stroke();
                }

                ctx.fillStyle = "#ffffff"; ctx.font = "bold 13px sans-serif";
                ctx.fillText("🧑 BẠN", player.x, player.y - 33);
            }

            // FX Chiêu thức
            fxList.forEach(fx => {
                if(fx.type === "BOTTLE") {
                    ctx.fillStyle = "#2ecc71"; ctx.fillRect(fx.x - 6, fx.y - 6, 12, 12);
                } else if(fx.type === "SPIN") {
                    ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.arc(fx.x, fx.y, 65, 0, Math.PI*2); ctx.stroke();
                }
            });

            // Damage Text
            dmgTexts.forEach(d => {
                ctx.fillStyle = d.color; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(d.text, d.x, d.y);
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
