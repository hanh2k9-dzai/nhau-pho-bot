<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhậu Phố Mobile - Combat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { background: #111; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { display: block; background: #2c221e; }

        /* Vùng điều khiển Joystick (Trái) */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Vùng nút Skill / Combat (Phải) */
        .action-btn {
            position: absolute;
            border-radius: 50%;
            border: none; color: white; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
        }
        .action-btn:active { transform: scale(0.9); }

        #btn-attack { bottom: 40px; right: 40px; width: 75px; height: 75px; background: #e74c3c; font-size: 16px; }
        #btn-defend { bottom: 130px; right: 30px; width: 55px; height: 55px; background: #3498db; font-size: 13px; }
        #btn-skill1 { bottom: 40px; right: 130px; width: 55px; height: 55px; background: #f1c40f; color: #2c3e50; font-size: 13px; }
        #btn-skill2 { bottom: 110px; right: 105px; width: 55px; height: 55px; background: #9b59b6; font-size: 13px; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- Cần gạt Joystick tròn -->
    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <!-- Cụm nút chiêu thức -->
    <button class="action-btn" id="btn-attack" onclick="doAction('ATTACK')">ĐẤM</button>
    <button class="action-btn" id="btn-defend" onclick="doAction('DEFEND')">THỦ</button>
    <button class="action-btn" id="btn-skill1" onclick="doAction('CHAI_BIA')">🍾 NÉM</button>
    <button class="action-btn" id="btn-skill2" onclick="doAction('XOAY_BAN')">🪑 XOAY</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 1. Sprites & Nhân vật
        const imgIdle = new Image(); imgIdle.src = "char_a_p1_1out_pfpn_v01.png";[span_0](start_span)[span_0](end_span)
        const imgFight = new Image(); imgFight.src = "char_a_p1_1out_fstr_v01.png";[span_1](start_span)[span_1](end_span)

        let player = {
            x: canvas.width / 2, y: canvas.height / 2,
            size: 80, speed: 4,
            vx: 0, vy: 0,
            state: "IDLE", // IDLE, ATTACK, DEFEND, SKILL
            actionText: "Bình thường", actionTimer: 0
        };

        let fxList = []; // Hiệu ứng chiêu thức (Chai bia, Vòng xoay bàn nhậu)

        // 2. Logic Cần gạt Joystick
        const zone = document.getElementById("joystick-zone");
        const knob = document.getElementById("joystick-knob");
        let joystickActive = false;
        let joyOrigin = { x: 0, y: 0 };

        zone.addEventListener("touchstart", (e) => {
            joystickActive = true;
            const rect = zone.getBoundingClientRect();
            joyOrigin = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        });

        window.addEventListener("touchmove", (e) => {
            if (!joystickActive) return;
            const touch = e.touches[0];
            let dx = touch.clientX - joyOrigin.x;
            let dy = touch.clientY - joyOrigin.y;
            let dist = Math.hypot(dx, dy);
            let maxRadius = 40;

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }

            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            player.vx = (dx / maxRadius) * player.speed;
            player.vy = (dy / maxRadius) * player.speed;
        });

        window.addEventListener("touchend", () => {
            joystickActive = false;
            knob.style.transform = `translate(0px, 0px)`;
            player.vx = 0; player.vy = 0;
        });

        // 3. Xử lý Chiêu Thức & Tấn Công
        function doAction(type) {
            player.actionTimer = 30; // Kéo dài hiệu ứng 30 frames
            if (type === "ATTACK") {
                player.state = "ATTACK";
                player.actionText = "👊 Đấm Côn Đồ!";
            } else if (type === "DEFEND") {
                player.state = "DEFEND";
                player.actionText = "🛡️ Thủ Ghế (Giảm 80% Sát thương)";
            } else if (type === "CHAI_BIA") {
                player.state = "SKILL";
                player.actionText = "🍾 Phi Chai Bia!";
                fxList.push({ type: "BOTTLE", x: player.x, y: player.y, vx: 10, vy: -2, life: 40 });
            } else if (type === "XOAY_BAN") {
                player.state = "SKILL";
                player.actionText = "🪑 Tuyệt Kỹ: Xoay Bàn Nhậu!";
                fxList.push({ type: "SPIN_TABLE", x: player.x, y: player.y, radius: 20, life: 30 });
            }
        }

        // 4. Game Loop
        function update() {
            // Cập nhật vị trí nhân vật từ Joystick
            player.x += player.vx;
            player.y += player.vy;

            // Giữ trong màn hình
            player.x = Math.max(40, Math.min(canvas.width - 40, player.x));
            player.y = Math.max(40, Math.min(canvas.height - 40, player.y));

            // Đếm ngược trạng thái hành động
            if (player.actionTimer > 0) {
                player.actionTimer--;
                if (player.actionTimer === 0) player.state = "IDLE";
            }

            // Cập nhật hiệu ứng chiêu thức
            fxList.forEach((fx, index) => {
                fx.life--;
                if (fx.type === "BOTTLE") fx.x += fx.vx;
                if (fx.type === "SPIN_TABLE") fx.radius += 4;
                if (fx.life <= 0) fxList.splice(index, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Sàn quán nhậu
            ctx.fillStyle = "#3a2e2b";
            ctx.fillRect(10, 10, canvas.width - 20, canvas.height - 20);

            // Vẽ hiệu ứng chiêu thức
            fxList.forEach(fx => {
                if (fx.type === "BOTTLE") {
                    ctx.fillStyle = "#2ecc71";
                    ctx.beginPath(); ctx.arc(fx.x, fx.y, 10, 0, Math.PI * 2); ctx.fill();
                } else if (fx.type === "SPIN_TABLE") {
                    ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.arc(player.x, player.y, fx.radius, 0, Math.PI * 2); ctx.stroke();
                }
            });

            // Vẽ nhân vật
            let currentImg = (player.state === "IDLE") ? imgIdle : imgFight;
            if (currentImg.complete && currentImg.naturalWidth !== 0) {
                ctx.drawImage(currentImg, player.x - player.size/2, player.y - player.size/2, player.size, player.size);
            } else {
                ctx.fillStyle = player.state === "DEFEND" ? "#3498db" : (player.state === "IDLE" ? "#2ecc71" : "#e74c3c");
                ctx.beginPath(); ctx.arc(player.x, player.y, player.size/2, 0, Math.PI * 2); ctx.fill();
            }

            // Vẽ Giáp Phòng Thủ nếu đang THỦ
            if (player.state === "DEFEND") {
                ctx.strokeStyle = "#3498db"; ctx.lineWidth = 5;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.size/2 + 10, 0, Math.PI * 2); ctx.stroke();
            }

            // HUD / Thông báo
            ctx.fillStyle = "#fff"; ctx.font = "18px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(player.actionTimer > 0 ? player.actionText : "Trạng thái: Đang di chuyển...", canvas.width / 2, 40);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
