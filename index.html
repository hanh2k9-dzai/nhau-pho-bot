<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhậu Phố Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1615; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }

        /* MÀN HÌNH MENU */
        #menu-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #2c1f1d 0%, #110d0c 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px; text-align: center;
        }
        #menu-screen h1 {
            font-size: 32px; color: #f1c40f; text-shadow: 0 4px 10px rgba(0,0,0,0.7);
            margin-bottom: 10px; font-weight: 900;
        }
        #menu-screen p.subtitle {
            font-size: 14px; color: #bdc3c7; margin-bottom: 30px;
        }
        .menu-btn {
            width: 220px; padding: 14px 20px; margin: 10px 0; border: none; border-radius: 25px;
            font-size: 16px; font-weight: bold; color: white; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); transition: transform 0.1s;
        }
        .menu-btn:active { transform: scale(0.95); }
        #btn-start { background: linear-gradient(45deg, #e67e22, #e74c3c); }
        #btn-guide { background: linear-gradient(45deg, #3498db, #2980b9); }

        /* POPUP HƯỚNG DẪN */
        #guide-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); z-index: 1001;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            background: #2c221e; border: 2px solid #f1c40f; border-radius: 15px;
            padding: 20px; max-width: 320px; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        .modal-content h3 { color: #f1c40f; margin-bottom: 15px; text-align: center; }
        .modal-content ul { list-style: none; line-height: 1.8; font-size: 14px; margin-bottom: 20px; }
        .close-btn {
            width: 100%; padding: 10px; background: #e74c3c; color: white; border: none;
            border-radius: 8px; font-weight: bold;
        }

        /* GAME CANVAS & CONTROLS */
        canvas { display: block; width: 100vw; height: 100vh; background: #2c221e; }

        /* Nút Back Menu trong game */
        #btn-back-menu {
            position: absolute; top: 15px; left: 15px; z-index: 999;
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.4);
            color: white; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: bold;
        }

        /* Joystick (Trái) */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 110px; height: 110px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; z-index: 999; display: none;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 46px; height: 46px; margin-top: -23px; margin-left: -23px;
            background: #ffffff; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* Nút Skill (Phải) */
        .action-btn {
            position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); color: white; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center;
            z-index: 999; -webkit-tap-highlight-color: transparent;
        }
        .action-btn:active { transform: scale(0.9); }

        #btn-attack { bottom: 30px; right: 30px; width: 75px; height: 75px; background: #e74c3c; font-size: 16px; }
        #btn-defend { bottom: 120px; right: 25px; width: 55px; height: 55px; background: #3498db; font-size: 13px; }
        #btn-skill1 { bottom: 30px; right: 120px; width: 55px; height: 55px; background: #f1c40f; color: #2c3e50; font-size: 13px; }
        #btn-skill2 { bottom: 95px; right: 90px; width: 55px; height: 55px; background: #9b59b6; font-size: 13px; }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1>🍻 NHẬU PHỐ 2D</h1>
        <p class="subtitle">Mini App Game Đại Chiến Quán Nhậu</p>
        <button class="menu-btn" id="btn-start">🚀 BẮT ĐẦU NHẬU</button>
        <button class="menu-btn" id="btn-guide">📖 HƯỚNG DẪN</button>
    </div>

    <div id="guide-modal">
        <div class="modal-content">
            <h3>📖 CÁCH CHƠI</h3>
            <ul>
                <li>🕹️ <b>Cần gạt (Trái):</b> Di chuyển nhân vật.</li>
                <li>👊 <b>Nút ĐẤM:</b> Cận chiến liên hoàn.</li>
                <li>🛡️ <b>Nút THỦ:</b> Dùng ghế đỡ sát thương.</li>
                <li>🍾 <b>Nút NÉM:</b> Phi chai bia tầm xa.</li>
                <li>🪑 <b>Nút XOAY:</b> Quét sạch bàn xung quanh.</li>
            </ul>
            <button class="close-btn" onclick="toggleGuide(false)">ĐÃ HIỂU</button>
        </div>
    </div>

    <button id="btn-back-menu" style="display:none;" onclick="returnToMenu()">🏠 MENU</button>
    <canvas id="gameCanvas"></canvas>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <button class="action-btn" id="btn-attack">ĐẤM</button>
    <button class="action-btn" id="btn-defend">THỦ</button>
    <button class="action-btn" id="btn-skill1">🍾 NÉM</button>
    <button class="action-btn" id="btn-skill2">🪑 XOAY</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameState = "MENU"; // "MENU" hoặc "PLAYING"

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        // SYSTEM NẠP FILE ẢNH NHÂN VẬT CỦA BẠN (100% FILE ẢNH)
        const imgIdle = new Image();
        let idleLoaded = false;
        imgIdle.onload = () => { idleLoaded = true; };
        imgIdle.src = "char_a_p1_1out_pfpn_v01.png";

        const imgFight = new Image();
        let fightLoaded = false;
        imgFight.onload = () => { fightLoaded = true; };
        imgFight.src = "char_a_p1_1out_fstr_v01.png";

        // Tự động tính toán Animation Frame nếu ảnh của bạn là Sprite Sheet
        let animFrame = 0;
        let animTimer = 0;

        // Player Info
        let player = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            size: 90, speed: 5,
            vx: 0, vy: 0,
            state: "IDLE", actionText: "", actionTimer: 0
        };

        let fxList = [];

        // QUẢN LÝ MÀN HÌNH MENU / GAME
        function startGame() {
            gameState = "PLAYING";
            document.getElementById("menu-screen").style.display = "none";
            document.getElementById("btn-back-menu").style.display = "block";
            document.getElementById("joystick-zone").style.display = "block";
            document.querySelectorAll(".action-btn").forEach(btn => btn.style.display = "flex");
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
        }

        function returnToMenu() {
            gameState = "MENU";
            document.getElementById("menu-screen").style.display = "flex";
            document.getElementById("btn-back-menu").style.display = "none";
            document.getElementById("joystick-zone").style.display = "none";
            document.querySelectorAll(".action-btn").forEach(btn => btn.style.display = "none");
        }

        function toggleGuide(show) {
            document.getElementById("guide-modal").style.display = show ? "flex" : "none";
        }

        document.getElementById("btn-start").onclick = startGame;
        document.getElementById("btn-guide").onclick = () => toggleGuide(true);

        // JOYSTICK CONTROLS
        const zone = document.getElementById("joystick-zone");
        const knob = document.getElementById("joystick-knob");
        let activeTouchId = null;

        zone.addEventListener("touchstart", (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            activeTouchId = touch.identifier;
            moveKnob(touch);
        }, { passive: false });

        window.addEventListener("touchmove", (e) => {
            if (activeTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === activeTouchId) {
                    moveKnob(e.changedTouches[i]);
                    break;
                }
            }
        }, { passive: false });

        const stopKnob = (e) => {
            if (activeTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === activeTouchId) {
                    activeTouchId = null;
                    knob.style.transform = `translate(0px, 0px)`;
                    player.vx = 0; player.vy = 0;
                    break;
                }
            }
        };

        window.addEventListener("touchend", stopKnob);
        window.addEventListener("touchcancel", stopKnob);

        function moveKnob(touch) {
            const rect = zone.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            let dx = touch.clientX - cx;
            let dy = touch.clientY - cy;
            let dist = Math.hypot(dx, dy);
            let maxR = 40;

            if (dist > maxR) {
                dx = (dx / dist) * maxR;
                dy = (dy / dist) * maxR;
            }

            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            player.vx = (dx / maxR) * player.speed;
            player.vy = (dy / maxR) * player.speed;
        }

        // BUTTON ACTIONS
        function doAction(type) {
            player.actionTimer = 20;
            if (type === "ATTACK") {
                player.state = "ATTACK"; player.actionText = "👊 ĐẤM CÔN ĐỒ!";
            } else if (type === "DEFEND") {
                player.state = "DEFEND"; player.actionText = "🛡️ THỦ GHẾ!";
            } else if (type === "CHAI_BIA") {
                player.state = "SKILL"; player.actionText = "🍾 PHI CHAI BIA!";
                fxList.push({ type: "BOTTLE", x: player.x, y: player.y, vx: 12, life: 30 });
            } else if (type === "XOAY_BAN") {
                player.state = "SKILL"; player.actionText = "🪑 XOAY BÀN NHẬU!";
                fxList.push({ type: "SPIN", x: player.x, y: player.y, r: 10, life: 20 });
            }
        }

        function bindBtn(id, type) {
            const btn = document.getElementById(id);
            if(btn) {
                btn.addEventListener("touchstart", (e) => { e.preventDefault(); doAction(type); }, { passive: false });
            }
        }

        bindBtn("btn-attack", "ATTACK");
        bindBtn("btn-defend", "DEFEND");
        bindBtn("btn-skill1", "CHAI_BIA");
        bindBtn("btn-skill2", "XOAY_BAN");

        // UPDATE GAME
        function update() {
            if (gameState !== "PLAYING") return;

            player.x += player.vx;
            player.y += player.vy;

            player.x = Math.max(45, Math.min(canvas.width - 45, player.x));
            player.y = Math.max(45, Math.min(canvas.height - 45, player.y));

            if (player.actionTimer > 0) {
                player.actionTimer--;
                if (player.actionTimer === 0) player.state = "IDLE";
            }

            fxList.forEach((fx, i) => {
                fx.life--;
                if (fx.type === "BOTTLE") fx.x += fx.vx;
                if (fx.type === "SPIN") fx.r += 6;
                if (fx.life <= 0) fxList.splice(i, 1);
            });

            // Tăng timer animation
            animTimer++;
            if (animTimer % 8 === 0) {
                animFrame = (animFrame + 1) % 4; // Duyệt frame
            }
        }

        // DRAW GAME
        function draw() {
            if (gameState !== "PLAYING") return;

            // Background Sàn quán
            ctx.fillStyle = "#3a2e2b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Bàn nhậu trang trí
            ctx.fillStyle = "#5c4033";
            ctx.beginPath(); ctx.arc(100, 120, 45, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(canvas.width - 100, 140, 45, 0, Math.PI*2); ctx.fill();

            // Hiệu ứng Chiêu
            fxList.forEach(fx => {
                if (fx.type === "BOTTLE") {
                    ctx.save();
                    ctx.translate(fx.x, fx.y);
                    ctx.fillStyle = "#27ae60"; ctx.fillRect(-10, -4, 16, 8);
                    ctx.fillStyle = "#f39c12"; ctx.fillRect(6, -2, 6, 4);
                    ctx.restore();
                } else if (fx.type === "SPIN") {
                    ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 5;
                    ctx.beginPath(); ctx.arc(player.x, player.y, fx.r, 0, Math.PI * 2); ctx.stroke();
                }
            });

            // VẼ CHUẨN ĐÚNG FILE ẢNH NHÂN VẬT CỦA BẠN
            let activeImg = (player.state !== "IDLE") ? imgFight : imgIdle;
            let isReady = (player.state !== "IDLE") ? fightLoaded : idleLoaded;

            if (isReady && activeImg.naturalWidth > 0) {
                // Tự kiểm tra nếu ảnh là Sprite Sheet (Chiều rộng lớn gấp nhiều lần chiều cao)
                let frameWidth = activeImg.naturalWidth;
                let frameHeight = activeImg.naturalHeight;

                if (frameWidth > frameHeight) {
                    // Nếu là Sprite Sheet chứa nhiều ô ảnh
                    let totalCols = Math.floor(frameWidth / frameHeight);
                    let singleWidth = frameWidth / totalCols;
                    let currentColumn = animFrame % totalCols;

                    ctx.drawImage(
                        activeImg,
                        currentColumn * singleWidth, 0, singleWidth, frameHeight, // Cắt 1 frame từ sprite sheet
                        player.x - player.size / 2, player.y - player.size / 2, player.size, player.size // Vẽ lên canvas
                    );
                } else {
                    // Nếu là 1 tệp ảnh đơn bình thường
                    ctx.drawImage(activeImg, player.x - player.size / 2, player.y - player.size / 2, player.size, player.size);
                }
            }

            // Giáp Phòng Thủ
            if (player.state === "DEFEND") {
                ctx.strokeStyle = "#3498db"; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.size/2 + 8, 0, Math.PI * 2); ctx.stroke();
            }

            // HUD Text
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(player.actionTimer > 0 ? player.actionText : "KÉO CẦN GẠT ĐỂ DI CHUYỂN", canvas.width / 2, 40);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
