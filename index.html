<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhậu Phố Online - Pixel Demo</title>
    <!-- Tải thư viện Phaser 3 từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100%;
            max-width: 800px;
            height: 600px;
        }
    </style>
</head>
<body>

<div id="game-container"></div>

<script>
class MainScene extends Phaser.Scene {
    constructor() {
        super('MainScene');
    }

    preload() {
        // Tạo sẵn các hình ảnh mẫu trực tiếp bằng code (không cần tải file ảnh ngoài để test nhanh)
        let graphics = this.make.graphics({ x: 0, y: 0, add: false });

        // 1. Tạo ô nền vỉa hè (màu xám rêu)
        graphics.fillStyle(0x4a5d4e);
        graphics.fillRect(0, 0, 32, 32);
        graphics.generateTexture('ground_tile', 32, 32);

        // 2. Tạo vật cản / Bàn nhậu (màu nâu gỗ)
        graphics.clear();
        graphics.fillStyle(0x8b4513);
        graphics.fillRect(0, 0, 48, 32);
        graphics.generateTexture('table_sprite', 48, 32);

        // 3. Tạo nhân vật player (hình ô vuông cam có viền)
        graphics.clear();
        graphics.fillStyle(0xffa500);
        graphics.fillRect(0, 0, 28, 28);
        graphics.lineStyle(2, 0xffffff);
        graphics.strokeRect(0, 0, 28, 28);
        graphics.generateTexture('player_sprite', 28, 28);
    }

    create() {
        // Lấp đầy màn hình bằng nền vỉa hè
        for (let x = 0; x < 800; x += 32) {
            for (let y = 0; y < 600; y += 32) {
                this.add.image(x + 16, y + 16, 'ground_tile');
            }
        }

        // Tạo nhóm vật cản (Các bàn nhậu trong quán)
        this.tables = this.physics.add.staticGroup();
        this.tables.create(200, 200, 'table_sprite');
        this.tables.create(500, 200, 'table_sprite');
        this.tables.create(350, 400, 'table_sprite');

        // Tạo nhân vật chính
        this.player = this.physics.add.sprite(400, 300, 'player_sprite');
        this.player.setCollideWorldBounds(true);

        // Thiết lập va chạm giữa nhân vật và bàn nhậu
        this.physics.add.collider(this.player, this.tables);

        // Hướng dẫn trên màn hình
        this.add.text(16, 16, 'DEMO NHẬU PHỐ ONLINE\nDùng các phím Mũi tên hoặc WASD để di chuyển', {
            fontSize: '16px',
            fill: '#ffffff',
            backgroundColor: '#000000',
            padding: { x: 8, y: 8 }
        });

        // Thiết lập bàn phím điều khiển
        this.cursors = this.input.keyboard.createCursorKeys();
        this.wasd = this.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D
        });
    }

    update() {
        const speed = 160;
        this.player.setVelocity(0);

        // Xử lý di chuyển trái / phải
        if (this.cursors.left.isDown || this.wasd.left.isDown) {
            this.player.setVelocityX(-speed);
        } else if (this.cursors.right.isDown || this.wasd.right.isDown) {
            this.player.setVelocityX(speed);
        }

        // Xử lý di chuyển lên / xuống
        if (this.cursors.up.isDown || this.wasd.up.isDown) {
            this.player.setVelocityY(-speed);
        } else if (this.cursors.down.isDown || this.wasd.down.isDown) {
            this.player.setVelocityY(speed);
        }
    }
}

// Cấu hình khung game
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'game-container',
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 0 },
            debug: false
        }
    },
    scene: [MainScene]
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
