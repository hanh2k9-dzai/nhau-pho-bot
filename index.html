<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhậu Phố Online - Mobile Test</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100%;
            max-width: 800px;
            height: 450px;
        }
        /* Giao diện cụm nút điều khiển trên điện thoại */
        #controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            gap: 5px;
        }
        .control-row {
            display: flex;
            gap: 40px;
        }
        .btn {
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            border-radius: 50%;
            font-size: 24px;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            outline: none;
            cursor: pointer;
        }
        .btn:active {
            background-color: rgba(255, 165, 0, 0.6);
        }
    </style>
</head>
<body>

<div id="game-container"></div>

<!-- Các nút bấm ảo trên màn hình điện thoại -->
<div id="controls">
    <div class="control-row">
        <div class="btn" id="btn-up">⬆️</div>
    </div>
    <div class="control-row">
        <div class="btn" id="btn-left">⬅️</div>
        <div class="btn" id="btn-right">➡️</div>
    </div>
    <div class="control-row">
        <div class="btn" id="btn-down">⬇️</div>
    </div>
</div>

<script>
class MainScene extends Phaser.Scene {
    constructor() {
        super('MainScene');
    }

    preload() {
        let graphics = this.make.graphics({ x: 0, y: 0, add: false });

        // Nền vỉa hè
        graphics.fillStyle(0x4a5d4e);
        graphics.fillRect(0, 0, 32, 32);
        graphics.generateTexture('ground_tile', 32, 32);

        // Bàn nhậu
        graphics.clear();
        graphics.fillStyle(0x8b4513);
        graphics.fillRect(0, 0, 48, 32);
        graphics.generateTexture('table_sprite', 48, 32);

        // Nhân vật
        graphics.clear();
        graphics.fillStyle(0xffa500);
        graphics.fillRect(0, 0, 28, 28);
        graphics.lineStyle(2, 0xffffff);
        graphics.strokeRect(0, 0, 28, 28);
        graphics.generateTexture('player_sprite', 28, 28);
    }

    create() {
        for (let x = 0; x < 800; x += 32) {
            for (let y = 0; y < 600; y += 32) {
                this.add.image(x + 16, y + 16, 'ground_tile');
            }
        }

        this.tables = this.physics.add.staticGroup();
        this.tables.create(200, 200, 'table_sprite');
        this.tables.create(500, 200, 'table_sprite');
        this.tables.create(350, 350, 'table_sprite');

        this.player = this.physics.add.sprite(400, 200, 'player_sprite');
        this.player.setCollideWorldBounds(true);
        this.physics.add.collider(this.player, this.tables);

        // Biến trạng thái điều khiển trên mobile
        window.moveState = { left: false, right: false, up: false, down: false };

        // Gắn sự kiện cảm ứng cho các nút HTML bên dưới
        const bindButton = (id, direction) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); window.moveState[direction] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); window.moveState[direction] = false; });
            // Hỗ trợ cả click chuột test trên máy tính
            el.addEventListener('mousedown', () => { window.moveState[direction] = true; });
            el.addEventListener('mouseup', () => { window.moveState[direction] = false; });
        };

        bindButton('btn-up', 'up');
        bindButton('btn-down', 'down');
        bindButton('btn-left', 'left');
        bindButton('btn-right', 'right');

        this.cursors = this.input.keyboard.createCursorKeys();
    }

    update() {
        const speed = 160;
        this.player.setVelocity(0);

        // Kiểm tra phím bàn phím hoặc nút ảo mobile
        if (this.cursors.left.isDown || window.moveState.left) {
            this.player.setVelocityX(-speed);
        } else if (this.cursors.right.isDown || window.moveState.right) {
            this.player.setVelocityX(speed);
        }

        if (this.cursors.up.isDown || window.moveState.up) {
            this.player.setVelocityY(-speed);
        } else if (this.cursors.down.isDown || window.moveState.down) {
            this.player.setVelocityY(speed);
        }
    }
}

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 450,
    parent: 'game-container',
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 0 }, debug: false }
    },
    scene: [MainScene]
};

const game = new Phaser.Game(config);
</script>

</body>
</html>
