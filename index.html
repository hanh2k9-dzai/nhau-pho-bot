<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhậu Phố Simulator 2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; color: white; }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        canvas { display: block; width: 100%; height: 100%; }

        /* UI MENU */
        #menu-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        #menu-screen h1 { font-size: 36px; color: #f1c40f; margin-bottom: 10px; text-shadow: 0 0 10px #000; }
        .menu-btn {
            width: 200px; padding: 12px; margin: 8px; border: none; border-radius: 20px;
            font-size: 16px; font-weight: bold; color: white; cursor: pointer;
        }
        #btn-start { background: #e74c3c; }
        #btn-guide { background: #3498db; }

        /* HUD MÁU UI */
        #hud {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: none; justify-content: space-between; z-index: 50; pointer-events: none;
        }
        .hp-box { background: rgba(0,0,0,0.7); padding: 8px; border-radius: 8px; width: 140px; border: 1px solid #555; }
        .hp-bar { width: 100%; height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 4px; }
        .hp-fill { height: 100%; transition: width 0.1s; }

        /* JOYSTICK & BUTTONS MOBILE */
        #joystick-zone {
            position: absolute; bottom: 20px; left: 20px; width: 100px; height: 100px;
            background: rgba(255,255,255,0.2); border-radius: 50%; z-index: 50; display: none;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 30px; height: 30px;
            background: #fff; border-radius: 50%; pointer-events: none;
        }
        .btn-act {
            position: absolute; width: 60px; height: 60px; border-radius: 50%; border: none;
            color: white; font-weight: bold; z-index: 50; display: none; align-items: center; justify-content: center;
        }
        #btn-atk { bottom: 20px; right: 20px; background: #e74c3c; width: 70px; height: 70px; }
        #btn-def { bottom: 100px; right: 20px; background: #3498db; }
        #btn-s1 { bottom: 20px; right: 100px; background: #f1c40f; color: #000; }
        #btn-s2 { bottom: 90px; right: 90px; background: #9b59b6; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- MENU -->
    <div id="menu-screen">
        <h1>🍻 NHẬU PHỐ 2D</h1>
        <button class="menu-btn" id="btn-start" onclick="startGame()">🚀 VÀO CHIẾN NAY</button>
    </div>

    <!-- HUD THANH MÁU -->
    <div id="hud">
        <div class="hp-box">
            <div style="font-size:12px;">🧑 BẠN</div>
            <div class="hp-bar"><div id="p-hp" class="hp-fill" style="background:#2ecc71; width:100%;"></div></div>
        </div>
        <div class="hp-box" style="text-align:right;">
            <div style="font-size:12px;">😈 CÔN ĐỒ</div>
            <div class="hp-bar"><div id="e-hp" class="hp-fill" style="background:#e74c3c; width:100%;"></div></div>
        </div>
    </div>

    <!-- CONTROLS MOBILE -->
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <button class="btn-act" id="btn-atk">ĐẤM</button>
    <button class="btn-act" id="btn-def">THỦ</button>
    <button class="btn-act" id="btn-s1">NÉM</button>
    <button class="btn-act" id="btn-s2">XOAY</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let inGame = false;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        // ĐỐI TƯỢNG BẠN
        let player = {
            x: 100, y: 100, r: 25, speed: 4,
            hp: 220, maxHp: 220, vx: 0, vy: 0,
            state: "IDLE", timer: 0
        };

        // ĐỐI TƯỢNG CÔN ĐỒ (SPAWN NGAY TỪ ĐẦU)
        let enemy = {
            x: 300, y: 300, r: 28, speed: 2,
            hp: 100, maxHp: 100, cooldown: 0, hit: 0
        };

        let keys = {};
        let dmgTexts = [];
        let fxList = [];

        function spawnEnemy() {
            enemy.hp = enemy.maxHp;
            enemy.x = Math.random() * (canvas.width - 200) + 100;
            enemy.y = Math.random() * (canvas.height - 200) + 100;
        }

        function startGame() {
            inGame = true;
            document.getElementById("menu-screen").style.display = "none";
            document.getElementById("hud").style.display = "flex";

            player.x = canvas.width / 3;
            player.y = canvas.height / 2;
            player.hp = player.maxHp;

            spawnEnemy();

            if ('ontouchstart' in window) {
                document.getElementById("joystick-zone").style.display = "block";
                document.querySelectorAll(".btn-act").forEach(b => b.style.display = "flex");
            }
        }

        window.addEventListener("keydown", e => {
            keys[e.key.toLowerCase()] = true;
            if(!inGame) return;
            if(e.key.toLowerCase() === 'j') doAttack("PUNCH");
            if(e.key.toLowerCase() === 'k') doAttack("DEFEND");
            if(e.key.toLowerCase() === 'l') doAttack("THROW");
            if(e.key.toLowerCase() === 'u') doAttack("SPIN");
        });
        window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

        function doAttack(type) {
            if(player.timer > 0) return;
            player.timer = 15;

            if(type === "PUNCH") {
                player.state = "ATK";
                let d = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if(d < 70) hitEnemy(Math.floor(Math.random()*6) + 15);
            } else if(type === "DEFEND") {
                player.state = "DEF";
            } else if(type === "THROW") {
                let a = Math.atan2(enemy.y - player.y, enemy.x - player.x);
                fxList.push({type: "BOTTLE", x: player.x, y: player.y, vx: Math.cos(a)*10, vy: Math.sin(a)*10, life: 30});
            } else if(type === "SPIN") {
                fxList.push({type: "SPIN", x: player.x, y: player.y, r: 10, life: 15});
                let d = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if(d < 90) hitEnemy(Math.floor(Math.random()*6) + 15);
            }
        }

        function hitEnemy(dmg) {
            enemy.hp -= dmg;
            enemy.hit = 8;
            dmgTexts.push({x: enemy.x, y: enemy.y - 30, text: "-" + dmg, life: 25, color: "#ff4d4d"});
            if(enemy.hp <= 0) spawnEnemy();
        }

        // BẮT NÚT MOBILE
        function bind(id, type) {
            let b = document.getElementById(id);
            if(b) b.onclick = () => doAttack(type);
        }
        bind("btn-atk", "PUNCH"); bind("btn-def", "DEFEND");
        bind("btn-s1", "THROW"); bind("btn-s2", "SPIN");

        // GAME LOOP (LUÔN CHẠY ĐỂ VẼ MÀN HÌNH)
        function update() {
            if(inGame) {
                // Di chuyển Bạn
                if(keys['w'] || keys['arrowup']) player.y -= player.speed;
                if(keys['s'] || keys['arrowdown']) player.y += player.speed;
                if(keys['a'] || keys['arrowleft']) player.x -= player.speed;
                if(keys['d'] || keys['arrowright']) player.x += player.speed;

                if(player.timer > 0) {
                    player.timer--;
                    if(player.timer === 0) player.state = "IDLE";
                }

                // Côn đồ đuổi theo
                let edx = player.x - enemy.x;
                let edy = player.y - enemy.y;
                let edist = Math.hypot(edx, edy);

                if(edist > 40) {
                    enemy.x += (edx / edist) * enemy.speed;
                    enemy.y += (edy / edist) * enemy.speed;
                } else {
                    if(enemy.cooldown <= 0) {
                        let dmg = Math.floor(Math.random()*5) + 10;
                        if(player.state === "DEF") dmg = Math.floor(dmg * 0.2);
                        player.hp -= dmg;
                        dmgTexts.push({x: player.x, y: player.y - 30, text: "-" + dmg, life: 25, color: player.state === "DEF" ? "#3498db" : "#ff4d4d"});
                        enemy.cooldown = 40;
                    }
                }

                if(enemy.cooldown > 0) enemy.cooldown--;
                if(enemy.hit > 0) enemy.hit--;

                // FX Đòn đánh
                fxList.forEach((fx, i) => {
                    fx.life--;
                    if(fx.type === "BOTTLE") {
                        fx.x += fx.vx; fx.y += fx.vy;
                        if(Math.hypot(fx.x - enemy.x, fx.y - enemy.y) < 30) {
                            hitEnemy(18); fx.life = 0;
                        }
                    }
                    if(fx.life <= 0) fxList.splice(i, 1);
                });

                // Cập nhật UI
                document.getElementById("p-hp").style.width = Math.max(0, (player.hp/player.maxHp)*100) + "%";
                document.getElementById("e-hp").style.width = Math.max(0, (enemy.hp/enemy.maxHp)*100) + "%";
            }

            dmgTexts.forEach((d, i) => {
                d.y -= 1; d.life--;
                if(d.life <= 0) dmgTexts.splice(i, 1);
            });
        }

        function draw() {
            // Nền quán nhậu
            ctx.fillStyle = "#221c19";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Bàn nhậu trang trí
            ctx.fillStyle = "#4a3328";
            ctx.beginPath(); ctx.arc(150, 150, 50, 0, Math.PI*2); ctx.fill();

            // VẼ CÔN ĐỒ (MÀU ĐỎ ĐẬM + TÊN RÕ RÀNG)
            ctx.fillStyle = enemy.hit > 0 ? "#ffffff" : "#d63031";
            ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.r, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "#ff7675"; ctx.lineWidth = 3; ctx.stroke();

            // Tên Côn đồ
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("😈 CÔN ĐỒ", enemy.x, enemy.y - 35);

            // VẼ NHÂN VẬT BẠN
            if(inGame) {
                ctx.fillStyle = player.state === "ATK" ? "#e67e22" : "#0984e3";
                ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();

                if(player.state === "DEF") {
                    ctx.strokeStyle = "#2ecc71"; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 6, 0, Math.PI*2); ctx.stroke();
                }

                ctx.fillStyle = "#ffffff"; ctx.font = "bold 14px sans-serif";
                ctx.fillText("🧑 BẠN", player.x, player.y - 32);
            }

            // Vẽ Chiêu thức
            fxList.forEach(fx => {
                if(fx.type === "BOTTLE") {
                    ctx.fillStyle = "#2ecc71"; ctx.fillRect(fx.x - 6, fx.y - 6, 12, 12);
                } else if(fx.type === "SPIN") {
                    ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.arc(fx.x, fx.y, 60, 0, Math.PI*2); ctx.stroke();
                }
            });

            // Text Sát thương
            dmgTexts.forEach(d => {
                ctx.fillStyle = d.color; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(d.text, d.x, d.y);
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
