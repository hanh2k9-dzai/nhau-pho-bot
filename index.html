<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhậu Phố Online - Avatar Style & Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #1a1a1a;
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: none;
        }
        
        /* Giao diện Menu trên cùng */
        #top-ui {
            position: absolute; top: 0; left: 0; width: 100%;
            height: 50px; background-color: rgba(44, 62, 80, 0.95);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px; box-sizing: border-box; z-index: 10;
            border-bottom: 2px solid #34495e;
        }
        .user-info { display: flex; align-items: center; color: white; font-weight: bold; }
        .user-avatar { width: 35px; height: 35px; background-color: #e67e22; border: 2px solid #fff; border-radius: 5px; margin-right: 8px; }
        .menu-buttons { display: flex; gap: 8px; }
        .menu-btn {
            background-color: #2980b9; color: white;
            border: 2px solid #3498db; border-radius: 8px;
            padding: 4px 8px; font-size: 11px; font-weight: bold;
            cursor: pointer; display: flex; flex-direction: column; align-items: center;
        }
        .menu-btn:active { background-color: #1c5980; }

        /* Bảng Shop thời trang (Ẩn/Hiện) */
        #shop-modal {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: rgba(0, 0, 0, 0.9);
            border: 2px solid #f1c40f; border-radius: 10px; padding: 15px;
            color: white; z-index: 100; display: none; box-sizing: border-box;
        }
        #shop-modal h3 { margin-top: 0; color: #f1c40f; text-align: center; }
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #2c3e50; padding: 8px; margin-bottom: 8px; border-radius: 5px;
        }
        .shop-item button {
            background: #27ae60; color: white; border: none; padding: 5px 10px;
            border-radius: 4px; font-weight: bold; cursor: pointer;
        }
        .shop-item button:active { background: #1e8449; }
        #close-shop {
            width: 100%; background: #c0392b; color: white; border: none;
            padding: 8px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 5px;
        }

        /* Container Game */
        #game-container { width: 100%; height: 62vh; position: relative; }

        /* Cụm điều khiển Mobile */
        #controls-container {
            width: 100%; height: 38vh;
            background-color: #2c3e50;
            display: flex; justify-content: space-around; align-items: center;
        }
        #d-pad { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .control-row { display: flex; gap: 30px; }
        .btn {
            width: 60px; height: 60px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid #bdc3c7; border-radius: 50%;
            font-size: 24px; color: #fff;
            display: flex; justify-content: center; align-items: center;
            user-select: none; cursor: pointer;
        }
        .btn.pressed { background-color: #f39c12; border-color: #f1c40f; }
        
        #btn-action {
            width: 75px; height: 75px;
            background-color: #7f8c8d; border-color: #95a5a6;
            font-size: 26px; font-weight: bold; transition: 0.2s;
        }
        #btn-action.active { background-color: #27ae60; border-color: #2ecc71; box-shadow: 0 0 15px #2ecc71; }
    </style>
</head>
<body>

<!-- Menu trên -->
<div id="top-ui">
    <div class="user-info">
        <div class="user-avatar"></div>
        <div>
            <div style="font-size: 13px;">Bợm Nhậu</div>
            <div id="coin-display" style="color: #f1c40f; font-size: 11px;">💰 Xu: 0</div>
        </div>
    </div>
    <div class="menu-buttons">
        <div class="menu-btn" onclick="toggleShop()">🛒<span>Shop Đồ</span></div>
        <div class="menu-btn" onclick="alert('Mời bạn bè nhận 500 Xu!')">🎁<span>Mời</span></div>
        <div class="menu-btn" onclick="alert('Cài đặt âm thanh/rung')">⚙️<span>Cài</span></div>
    </div>
</div>

<!-- Giao diện Shop Mua Đồ (Phong cách Avatar) -->
<div id="shop-modal">
    <h3>🛍️ Tiệm Thời Trang Phố Nhậu</h3>
    <div class="shop-item">
        <span>👕 Áo Ba Sọc (Huyền thoại) - 50 Xu</span>
        <button onclick="buyItem('shirt_striped', 50)">Mua</button>
    </div>
    <div class="shop-item">
        <span>🧑‍عر Tóc Bờm Ngựa - 100 Xu</span>
        <button onclick="buyItem('hair_spiky', 100)">Mua</button>
    </div>
    <button id="close-shop" onclick="toggleShop()">Đóng</button>
</div>

<div id="game-container"></div>

<div id="controls-container">
    <div id="d-pad">
        <div class="control-row"><div class="btn" id="btn-up" data-dir="up">⬆️</div></div>
        <div class="control-row">
            <div class="btn" id="btn-left" data-dir="left">⬅️</div>
            <div class="btn" id="btn-right" data-dir="right">➡️</div>
        </div>
        <div class="control-row"><div class="btn" id="btn-down" data-dir="down">⬇️</div></div>
    </div>
    <div class="btn" id="btn-action">🍻</div>
</div>

<script>
let gameInstance = null;

function toggleShop() {
    const modal = document.getElementById('shop-modal');
    modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
}

function buyItem(itemType, cost) {
    if (gameInstance && gameInstance.scene.scenes[0]) {
        gameInstance.scene.scenes[0].purchaseItem(itemType, cost);
    }
}

class MainScene extends Phaser.Scene {
    constructor() { super('MainScene'); this.coins = 50; this.canDrink = false; this.currentShirt = 0.xe67e22; }

    preload() {
        // Tạo texture nhân vật với các kiểu áo khác nhau
        const createChar = (key, shirtCol) => {
            let g = this.make.graphics({ add: false });
            g.fillStyle(0xffcc99); g.fillRect(8, 0, 16, 14); // Đầu
            g.fillStyle(0x2c3e50); g.fillRect(8, 0, 16, 4);  // Tóc mặc định
            g.fillStyle(0x000000); g.fillRect(11, 6, 3, 3); g.fillRect(18, 6, 3, 3); // Mắt
            g.fillStyle(shirtCol); g.fillRect(6, 14, 20, 16); // Áo
            g.fillStyle(0xffcc99); g.fillRect(2, 14, 4, 10); g.fillRect(26, 14, 4, 10); // Tay
            g.fillStyle(0x111111); g.fillRect(6, 30, 8, 10); g.fillRect(18, 30, 8, 10); // Quần
            g.generateTexture(key, 32, 40);
        };

        createChar('player_default', 0xe67e22); // Áo cam
        createChar('player_striped', 0x3498db); // Áo xanh ba sọc giả lập
        createChar('npc_1', 0x9b59b6);        // NPC tím
        createChar('npc_2', 0x1abc9c);        // NPC xanh ngọc

        // Địa hình và Bàn ghế quán nhậu vỉa hè
        let g = this.make.graphics({ add: false });
        g.fillStyle(0x34495e); g.fillRect(0, 0, 32, 32); 
        g.lineStyle(1, 0x2c3e50); g.strokeRect(0, 0, 32, 32);
        g.generateTexture('ground', 32, 32);

        g.clear();
        g.fillStyle(0x8b4513); g.fillRect(10, 0, 40, 30); // Bàn gỗ
        g.fillStyle(0xd35400); g.fillRect(0, 5, 8, 20); g.fillRect(52, 5, 8, 20); // Ghế
        // Thêm chai bia nhỏ trên bàn cho có khí thế
        g.fillStyle(0x27ae60); g.fillRect(20, 8, 4, 10); g.fillRect(36, 8, 4, 10);
        g.generateTexture('table', 60, 30);
    }

    create() {
        // Vẽ bản đồ rộng 1200x900 (Đậm chất khu phố)
        for (let x = 0; x < 1200; x += 32) {
            for (let y = 0; y < 900; y += 32) { 
                this.add.image(x + 16, y + 16, 'ground'); 
            }
        }

        // Tạo khu vực bàn nhậu và các NPC đa dạng
        this.tables = this.physics.add.staticGroup();
        this.npcs = this.physics.add.group();

        const spawnTable = (x, y, npcKey, chatList) => {
            this.tables.create(x, y, 'table');
            let npc = this.npcs.create(x - 25, y, npcKey);
            npc.setImmovable(true);
            
            this.time.addEvent({
                delay: Phaser.Math.Between(6000, 12000),
                callback: () => {
                    let txt = Phaser.Math.RND.pick(chatList);
                    this.showChat(npc.x, npc.y - 20, txt, '#ecf0f1');
                },
                loop: true
            });
        };

        spawnTable(200, 200, 'npc_1', ["Làm ly nữa bác tài!", "Khô máu luôn anh em!", "Cho thêm đĩa đậu phộng!"]);
        spawnTable(600, 200, 'npc_2', ["Quán này mồi ngon phết!", "Hôm nay say không về!", "Vô ông giáo ơi!"]);
        spawnTable(400, 500, 'npc_1', ["Nâng ly chào đoàn kết!", "Ai bỏ cuộc là người đó yếu sinh lý!"]);

        // Nhân vật chính
        this.player = this.physics.add.sprite(300, 300, 'player_default');
        this.player.setCollideWorldBounds(true);
        this.physics.add.collider(this.player, this.tables);
        this.physics.add.collider(this.player, this.npcs);

        // Cài đặt Camera cho bản đồ rộng
        this.cameras.main.setBounds(0, 0, 1200, 900);
        this.cameras.main.startFollow(this.player);
        this.cameras.main.setZoom(1.3);

        // Phím điều khiển
        window.moveState = { left: false, right: false, up: false, down: false };
        this.setupMobileControls();

        this.actionBtn = document.getElementById('btn-action');
        this.actionBtn.addEventListener('touchstart', (e) => { e.preventDefault(); this.doNhau(); });
        this.actionBtn.addEventListener('mousedown', (e) => { e.preventDefault(); this.doNhau(); });
        this.cursors = this.input.keyboard.createCursorKeys();
        
        // Cập nhật hiển thị Xu ban đầu
        document.getElementById('coin-display').innerText = '💰 Xu: ' + this.coins;
    }

    purchaseItem(itemType, cost) {
        if (this.coins >= cost) {
            this.coins -= cost;
            document.getElementById('coin-display').innerText = '💰 Xu: ' + this.coins;
            
            if (itemType === 'shirt_striped') {
                this.player.setTexture('player_striped');
                alert("Đã mặc thành công Áo Ba Sọc phong cách Avatar!");
            } else if (itemType === 'hair_spiky') {
                alert("Đã đổi kiểu tóc mới cực chất!");
            }
            toggleShop();
        } else {
            alert("Không đủ Xu! Hãy ra bàn nhậu bấm 'DÔ!' kiếm thêm Xu nhé.");
        }
    }

    showChat(x, y, textStr, bgColor) {
        let txt = this.add.text(x, y, textStr, {
            fontSize: '11px', fill: '#000', backgroundColor: bgColor,
            padding: { x: 4, y: 4 }, fontStyle: 'bold'
        });
        txt.setOrigin(0.5, 1);
        txt.setDepth(100);
        
        this.tweens.add({
            targets: txt, y: y - 35, alpha: 0,
            duration: 2500, ease: 'Power1',
            onComplete: () => txt.destroy()
        });
    }

    doNhau() {
        if (this.canDrink) {
            this.coins += 10;
            document.getElementById('coin-display').innerText = '💰 Xu: ' + this.coins;
            this.showChat(this.player.x, this.player.y - 20, "1, 2, 3 DÔ 🍻!", '#f1c40f');
        }
    }

    setupMobileControls() {
        ['up', 'down', 'left', 'right'].forEach(dir => {
            const btn = document.getElementById(`btn-${dir}`);
            const press = (e) => { e.preventDefault(); window.moveState[dir] = true; btn.classList.add('pressed'); };
            const release = (e) => { e.preventDefault(); window.moveState[dir] = false; btn.classList.remove('pressed'); };
            btn.addEventListener('touchstart', press); btn.addEventListener('touchend', release); btn.addEventListener('touchcancel', release);
            btn.addEventListener('mousedown', press); btn.addEventListener('mouseup', release); btn.addEventListener('mouseleave', release);
        });
    }

    update() {
        const speed = 130;
        let vx = 0; let vy = 0;

        if (this.cursors.left.isDown || window.moveState.left) vx = -speed;
        else if (this.cursors.right.isDown || window.moveState.right) vx = speed;
        
        if (this.cursors.up.isDown || window.moveState.up) vy = -speed;
        else if (this.cursors.down.isDown || window.moveState.down) vy = speed;

        this.player.setVelocity(vx, vy);

        // Kiểm tra khoảng cách tới bàn nhậu
        let isNearTable = false;
        this.tables.getChildren().forEach(table => {
            if (Phaser.Math.Distance.Between(this.player.x, this.player.y, table.x, table.y) < 65) isNearTable = true;
        });

        if (isNearTable !== this.canDrink) {
            this.canDrink = isNearTable;
            if (this.canDrink) this.actionBtn.classList.add('active');
            else this.actionBtn.classList.remove('active');
        }
    }
}

const config = {
    type: Phaser.AUTO, width: '100%', height: '100%',
    parent: 'game-container',
    physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
    scene: [MainScene]
};
gameInstance = new Phaser.Game(config);
</script>

</body>
</html>
