<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhậu Phố Mini App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; background: #2c221e; }

        /* Joystick (Trái) */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 110px; height: 110px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; z-index: 99;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 45px; height: 45px;
            margin-top: -22.5px; margin-left: -22.5px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* Nút Skill (Phải) */
        .action-btn {
            position: absolute; border-radius: 50%; border: none; color: white; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            z-index: 99; -webkit-tap-highlight-color: transparent;
        }
        .action-btn:active { transform: scale(0.9); }

        #btn-attack { bottom: 30px; right: 30px; width: 75px; height: 75px; background: #e74c3c; font-size: 16px; }
        #btn-defend { bottom: 120px; right: 25px; width: 55px; height: 55px; background: #3498db; font-size: 13px; }
        #btn-skill1 { bottom: 30px; right: 120px; width: 55px; height: 55px; background: #f1c40f; color: #2c3e50; font-size: 13px; }
        #btn-skill2 { bottom: 95px; right: 90px; width: 55px; height: 55px; background: #9b59b6; font-size: 13px; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- Controls -->
    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <button class="action-btn" id="btn-attack">ĐẤM</button>
    <button class="action-btn" id="btn-defend">THỦ</button>
    <button class="action-btn" id="btn-skill1">🍾 NÉM</button>
    <button class="action-btn" id="btn-skill2">🪑 XOAY</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener("resize", resize);

        // NẠP ẢNH BẰNG LINK TRỰC TIẾP (BYPASS LỖI TELEGRAM PATH)
        let imgIdleLoaded = false;
        let imgFightLoaded = false;

        const imgIdle = new Image();
        imgIdle.crossOrigin = "Anonymous";
        imgIdle.onload = () => { imgIdleLoaded = true; };
        imgIdle.src = "char_a_p1_1out_pfpn_v01.png?v=" + Date.now(); // Thêm timestamp để bypass Cache Telegram

        const imgFight = new Image();
        imgFight.crossOrigin = "Anonymous";
        imgFight.onload = () => { imgFightLoaded = true; };
        imgFight.src = "char_a_p1_1out_fstr_v01.png?v=" + Date.now();

        // Nhân Vật
        let player = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2,
            size: 80, speed: 5,
            vx: 0, vy: 0,
            state: "IDLE", actionText: "", actionTimer: 0
        };

        let fxList = [];

        // JOYSTICK
        const zone = document.getElementById("joystick-zone");
        const knob = document.getElementById("joystick-knob");
        let activeTouchId = null;

        zone.addEventListener("touchstart", (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            activeTouchId = touch.identifier;
            moveKnob(touch);
        }, { passive: false });

        window.addEventListener("touchmove", (e) => {
            if (activeTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === activeTouchId) {
                    moveKnob(e.changedTouches[i]);
                    break;
                }
            }
        }, { passive: false });

        const stopKnob = (e) => {
            if (activeTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === activeTouchId) {
                    activeTouchId = null;
                    knob.style.transform = `translate(0px, 0px)`;
                    player.vx = 0; player.vy = 0;
                    break;
                }
            }
        };

        window.addEventListener("touchend", stopKnob);
        window.addEventListener("touchcancel", stopKnob);

        function moveKnob(touch) {
            const rect = zone.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            let dx = touch.clientX - cx;
            let dy = touch.clientY - cy;
            let dist = Math.hypot(dx, dy);
            let maxR = 40;

            if (dist > maxR) {
                dx = (dx / dist) * maxR;
                dy = (dy / dist) * maxR;
            }

            knob.style.transform = `translate(${dx}px, ${dy}px)`;
            player.vx = (dx / maxR) * player.speed;
            player.vy = (dy / maxR) * player.speed;
        }

        // CHIÊU THỨC
        function doAction(type) {
            player.actionTimer = 20;
            if (type === "ATTACK") {
                player.state = "ATTACK"; player.actionText = "👊 ĐẤM CÔN ĐỒ!";
            } else if (type === "DEFEND") {
                player.state = "DEFEND"; player.actionText = "🛡️ THỦ GHẾ!";
            } else if (type === "CHAI_BIA") {
                player.state = "SKILL"; player.actionText = "🍾 PHI CHAI BIA!";
                fxList.push({ type: "BOTTLE", x: player.x, y: player.y, vx: 12, life: 30 });
            } else if (type === "XOAY_BAN") {
                player.state = "SKILL"; player.actionText = "🪑 XOAY BÀN NHẬU!";
                fxList.push({ type: "SPIN", x: player.x, y: player.y, r: 10, life: 20 });
            }
        }

        function bindBtn(id, type) {
            const btn = document.getElementById(id);
            btn.addEventListener("touchstart", (e) => { e.preventDefault(); doAction(type); }, { passive: false });
        }

        bindBtn("btn-attack", "ATTACK");
        bindBtn("btn-defend", "DEFEND");
        bindBtn("btn-skill1", "CHAI_BIA");
        bindBtn("btn-skill2", "XOAY_BAN");

        // GAME LOOP
        function update() {
            player.x += player.vx;
            player.y += player.vy;

            player.x = Math.max(40, Math.min(canvas.width - 40, player.x));
            player.y = Math.max(40, Math.min(canvas.height - 40, player.y));

            if (player.actionTimer > 0) {
                player.actionTimer--;
                if (player.actionTimer === 0) player.state = "IDLE";
            }

            fxList.forEach((fx, i) => {
                fx.life--;
                if (fx.type === "BOTTLE") fx.x += fx.vx;
                if (fx.type === "SPIN") fx.r += 6;
                if (fx.life <= 0) fxList.splice(i, 1);
            });
        }

        function draw() {
            // Background Sàn quán
            ctx.fillStyle = "#3a2e2b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Bàn nhậu trang trí
            ctx.fillStyle = "#5c4033";
            ctx.beginPath(); ctx.arc(100, 100, 45, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(canvas.width - 100, 120, 45, 0, Math.PI*2); ctx.fill();

            // HIỆU ỨNG CHIÊU THỨC (VẼ CHAI BIA CHI TIẾT)
            fxList.forEach(fx => {
                if (fx.type === "BOTTLE") {
                    // Vẽ Chai bia xanh lá đẹp mắt thay vì hình tròn
                    ctx.save();
                    ctx.translate(fx.x, fx.y);
                    ctx.fillStyle = "#27ae60";
                    ctx.fillRect(-10, -4, 16, 8); // Thân chai
                    ctx.fillStyle = "#f39c12";
                    ctx.fillRect(6, -2, 6, 4);   // Cổ chai
                    ctx.restore();
                } else if (fx.type === "SPIN") {
                    ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 5;
                    ctx.beginPath(); ctx.arc(player.x, player.y, fx.r, 0, Math.PI * 2); ctx.stroke();
                }
            });

            // VẼ NHÂN VẬT
            let isFighting = (player.state !== "IDLE");
            let targetImg = isFighting ? imgFight : imgIdle;
            let isLoaded = isFighting ? imgFightLoaded : imgIdleLoaded;

            if (isLoaded) {
                ctx.drawImage(targetImg, player.x - player.size / 2, player.y - player.size / 2, player.size, player.size);
            } else {
                // FALLBACK NHÂN VẬT CHI TIẾT (Không chơi tròn trơn lụi nữa!)
                drawDetailedPlayer();
            }

            // Giáp Phòng Thủ
            if (player.state === "DEFEND") {
                ctx.strokeStyle = "#3498db"; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.size/2 + 8, 0, Math.PI * 2); ctx.stroke();
            }

            // HUD Text
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(player.actionTimer > 0 ? player.actionText : "KÉO CẦN GẠT ĐỂ DI CHUYỂN", canvas.width / 2, 40);
        }

        // Tự vẽ nhân vật hoạt hình bằng Canvas nếu chưa tải xong ảnh
        function drawDetailedPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            // Đầu
            ctx.fillStyle = "#f1c40f";
            ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#2c3e50"; ctx.lineWidth = 3; ctx.stroke();

            // Mắt
            ctx.fillStyle = "#2c3e50";
            ctx.beginPath(); ctx.arc(-10, -5, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(10, -5, 4, 0, Math.PI * 2); ctx.fill();

            // Miệng (Thay đổi khi đánh)
            if (player.state === "ATTACK") {
                ctx.fillStyle = "#e74c3c";
                ctx.beginPath(); ctx.arc(0, 10, 8, 0, Math.PI); ctx.fill();
            } else {
                ctx.beginPath(); ctx.arc(0, 8, 6, 0, Math.PI); ctx.stroke();
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
